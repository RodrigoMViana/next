# Publica no GitHub Pages a versão de DEMONSTRAÇÃO (BFF simulado no navegador, dados fictícios).
name: GitHub Pages (demonstração)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/next-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/next-app/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - name: Build em modo demonstração
        run: npx vite build --mode demo
        env:
          NEXT_OUT_DIR: dist-demo
      - run: touch dist-demo/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/next-app/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
