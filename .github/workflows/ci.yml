# Pipeline de integração contínua (Arquitetura 9.4, etapas 1 a 4)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Front-end (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/next-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/next-app/package-lock.json
      - run: npm ci
      - name: Lint (oxlint + ESLint)
        run: npx oxlint . && npx eslint .
      - name: Testes unitários (Vitest)
        run: npx vitest run
      - name: Checagem de tipos (TypeScript estrito)
        run: npx vue-tsc --build
      - name: Build
        run: npx vite build
      - uses: actions/upload-artifact@v7
        with:
          name: next-app-dist
          path: frontend/next-app/dist

  backend:
    name: Back-end (Java 25 / Spring Boot)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: next-app-dist
          path: frontend/next-app/dist
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Testes, arquitetura (ArchUnit) e cobertura (JaCoCo >= 80% nas regras de domínio)
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: relatorios-testes
          path: |
            backend/*/target/surefire-reports
            backend/next-configuracao/target/site/jacoco
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            backend/next-configuracao/target/next-configuracao.jar
            backend/next-bff/target/next-bff.jar

  oracle:
    name: Integração com Oracle (Flyway + teste de fumaça)
    runs-on: ubuntu-latest
    needs: backend
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: SenhaAdminCi1
          APP_USER: NEXT_CONFIGURACAO
          APP_USER_PASSWORD: SenhaCfgCi1
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sobe o módulo no Oracle e o BFF
        env:
          NEXT_TOKEN_INTERNO_SEGREDO: segredo-de-ci-com-mais-de-32-bytes-0123456789
        run: |
          find jars -name '*.jar'
          SPRING_PROFILES_ACTIVE=oracle NEXT_DB_URL=jdbc:oracle:thin:@//localhost:1521/FREEPDB1 \
            NEXT_DB_USUARIO=NEXT_CONFIGURACAO NEXT_DB_SENHA=SenhaCfgCi1 NEXT_DEMO_CARREGAR=true \
            nohup java -jar "$(find jars -name next-configuracao.jar)" > modulo.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:8081/actuator/health && break; sleep 5; done
          nohup java -jar "$(find jars -name next-bff.jar)" > bff.log 2>&1 &
          for i in $(seq 1 40); do curl -fs http://localhost:8080/actuator/health && break; sleep 3; done
      - name: Teste de fumaça ponta a ponta
        run: chmod +x scripts/teste-fumaca.sh && BASE=http://localhost:8080 ./scripts/teste-fumaca.sh
      - name: Logs
        if: always()
        run: tail -n 80 modulo.log bff.log || true
