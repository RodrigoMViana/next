# next-bff - único componente exposto à internet (Arquitetura 4.2)
server:
  port: ${NEXT_BFF_PORTA:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m                               # inatividade (Arquitetura 8.1)
      cookie:
        name: ${NEXT_SESSION_COOKIE:NEXT_SESSION}  # produção: __Host-next_session
        http-only: true
        secure: ${NEXT_COOKIE_SECURE:false}       # produção: true (HTTPS)
        same-site: lax
        path: /

spring:
  application:
    name: next-bff
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: false        # o BFF repassa o corpo bruto ao módulo; o tamanho é limitado no proxy
  mvc:
    format:
      date: iso
      date-time: iso
  web:
    resources:
      # Arquivos estáticos do next-app (build do Vue). Em contêiner: /app/static.
      static-locations: ${NEXT_APP_DIST:classpath:/static/}

next:
  auth:
    modo: ${NEXT_AUTH_MODO:dev}                  # dev (usuários fictícios) | oidc (gov.br - pendente)
    dev-mfa-codigo: ${NEXT_DEV_MFA:123456}       # código de MFA simulado para usuários de fábrica
    duracao-absoluta: 10h
  seguranca:
    token-interno:
      segredo: ${NEXT_TOKEN_INTERNO_SEGREDO:dev-somente-local-troque-este-segredo-0123456789}
      validade-segundos: 60
    limites:
      login-por-minuto: 10
      exportacoes-por-minuto: 3
      requisicoes-por-minuto: 600
  modulos:
    configuracao:
      habilitado: true
      url: ${NEXT_CONFIGURACAO_URL:http://localhost:8081}
      timeout-ms: 15000
  exportacao:
    validade-link: 24h
    max-registros: 50000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:next_audit;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password:

---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${NEXT_AUDIT_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${NEXT_AUDIT_DB_USUARIO:NEXT_AUDIT}
    password: ${NEXT_AUDIT_DB_SENHA}
