# next-configuracao - configuração padrão (perfil "local": H2 em modo Oracle + dados fictícios)
# Em homologação/produção use o perfil "oracle" e injete os segredos por variáveis de ambiente/cofre.
server:
  port: ${NEXT_CONFIGURACAO_PORTA:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: next-configuracao
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        type.preferred_uuid_jdbc_type: VARCHAR
        type.preferred_instant_jdbc_type: TIMESTAMP
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: always
  mvc:
    format:
      date: iso
      date-time: iso
      time: iso

next:
  seguranca:
    token-interno:
      # Segredo compartilhado com o BFF (HS256, mínimo 32 bytes). Em produção: cofre de segredos.
      segredo: ${NEXT_TOKEN_INTERNO_SEGREDO:dev-somente-local-troque-este-segredo-0123456789}
  integracao:
    portfolio:
      modo: ${NEXT_PORTFOLIO_MODO:demo}     # demo | http
      url: ${NEXT_PORTFOLIO_URL:http://localhost:8090/api/v1}
      token: ${NEXT_PORTFOLIO_TOKEN:}
      timeout-ms: 3000
    core:
      modo: demo
  eventos:
    publicador: log                          # log | redis (pendente)
    intervalo-ms: 5000
  demo:
    carregar: ${NEXT_DEMO_CARREGAR:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:next_configuracao;MODE=Oracle;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:

---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${NEXT_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${NEXT_DB_USUARIO:NEXT_CONFIGURACAO}
    password: ${NEXT_DB_SENHA}
    hikari:
      maximum-pool-size: 10
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
next:
  demo:
    carregar: ${NEXT_DEMO_CARREGAR:false}
